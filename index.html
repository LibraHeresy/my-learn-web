<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>代码乐章 — 从乐谱到代码</title>
  </head>
  <body>
    <div id="app"></div>
    <script>
      // GitHub Pages SPA redirect: restore path from 404.html redirect
      const base = '/my-learn-web/'
      const redirect = sessionStorage.getItem('__redirect')
      if (redirect) {
        sessionStorage.removeItem('__redirect')
        history.replaceState(null, '', base + redirect.replace(/^\//, ''))
      }
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
