<body>
  <div class="header">

  <div class="layout">
    <div class="panel panel-left">
      <div class="card left-card">

        <div class="desc">
          <p>页面上有一个输入框、一个"添加"按钮和一个 <code>&lt;ul&gt;</code>。编写 JS，点击按钮把输入框内容添加为列表项，并清空输入框。</p>

        <div class="checklist" style="margin:0;">
          <ul><li>输入内容点添加，出现在列表里</li><li>添加后输入框清空</li><li>可以连续添加多项</li></ul>
        </div>

      <div class="card code-card">

        <p class="hint" style="margin-bottom:8px;">在下方编写 JS 代码，点击"运行"生效。</p>
        <textarea id="code" spellcheck="false">// TODO: 编写你的代码
// 点击 #add，把 #input 的值添加为 #list 的 li，并清空输入框

const input = document.querySelector('#input');
const addBtn = document.querySelector('#add');
const list = document.querySelector('#list');

addBtn.addEventListener('click', () => {
  // 提示：createElement('li') + appendChild
});</textarea>
        <div class="btn-row">
          <button class="btn" onclick="runCode()">运行</button>
          <button class="btn reset" onclick="resetCode()">重置</button>
          <button class="btn" onclick="markDone()" style="background:#d4a72c;">我完成了</button>
          <span id="nextArea" style="display:none;">
            <a href="35-标记完成.html" class="btn next">下一题 →</a>
          </span>
        </div>

      </div>

  <script>
    const defaultCode = "// TODO: 编写你的代码\n// 点击 #add，把 #input 的值添加为 #list 的 li，并清空输入框\n\nconst input = document.querySelector('#input');\nconst addBtn = document.querySelector('#add');\nconst list = document.querySelector('#list');\n\naddBtn.addEventListener('click', () => {\n  // 提示：createElement('li') + appendChild\n});";

    function runCode() {
      const code = document.getElementById('code').value;
      const msg = document.getElementById('msg');
      // 重新构建演示区，清除上一次运行的事件监听
      const demo = document.getElementById('app');
      const demoHtml = "<div style=\"display:flex;gap:8px;\"><input id=\"input\" type=\"text\" placeholder=\"输入内容\" /><button id=\"add\">添加</button></div><ul id=\"list\"></ul>";
      demo.innerHTML = demoHtml;

      try {
        const fn = new Function(code);
        fn();
        msg.innerHTML = '<p style="color:#2da44e;margin-top:10px;">✓ 代码已运行，请在演示区测试效果。</p>';
      } catch (e) {
        msg.innerHTML = '<p style="color:#cf222e;margin-top:10px;">✗ 代码错误：' + e.message + '</p>';
      }
    }

    function resetCode() {
      document.getElementById('code').value = defaultCode;
      document.getElementById('msg').innerHTML = '';
    }

    function markDone() {
      const nextArea = document.getElementById('nextArea');
      nextArea.style.display = 'block';
      document.getElementById('msg').innerHTML = '<p style="color:#2da44e;margin-top:10px;">✓ 已完成！继续下一题吧。</p>';
    }

    // ===== 编辑器增强：Tab 缩进 + Alt+Shift+F 格式化 =====
    function attachEditor(textareaId) {
      const ta = document.getElementById(textareaId);
      if (!ta) return;

      // Tab 键缩进
      ta.addEventListener('keydown', function (e) {
        if (e.key === 'Tab') {
          e.preventDefault();
          const start = ta.selectionStart;
          const end = ta.selectionEnd;
          const value = ta.value;
          const lineStart = value.lastIndexOf('\n', start - 1) + 1;

          if (e.shiftKey) {
            // Shift+Tab：反向缩进当前行（去掉行首最多 2 个空格）
            const lineEnd = value.indexOf('\n', start);
            const endPos = lineEnd === -1 ? value.length : lineEnd;
            const line = value.substring(lineStart, endPos);
            const match = line.match(/^[ \t]+/);
            if (match) {
              const remove = Math.min(2, match[0].length);
              const newValue = value.substring(0, lineStart) + value.substring(lineStart + remove);
              ta.value = newValue;
              const newPos = start - remove;
              ta.selectionStart = ta.selectionEnd = Math.max(lineStart, newPos);
            }
          } else {
            // 有选中文本：对每行整体缩进
            if (start !== end) {
              const selected = value.substring(start, end);
              const lines = selected.split('\n');
              const indented = lines.map(l => '  ' + l).join('\n');
              ta.value = value.substring(0, start) + indented + value.substring(end);
              ta.selectionStart = start;
              ta.selectionEnd = start + indented.length;
            } else {
              // 无选中：插入 2 个空格
              ta.value = value.substring(0, start) + '  ' + value.substring(end);
              ta.selectionStart = ta.selectionEnd = start + 2;
            }
          }
        }

        // Alt+Shift+F 格式化
        if (e.key === 'F' && e.altKey && e.shiftKey) {
          e.preventDefault();
          try {
            ta.value = formatJS(ta.value);
          } catch (err) {
            // 格式化失败则忽略
          }
        }
      });

      // 轻量 JS 格式化：基于缩进的简单美化
      function formatJS(code) {
        const lines = code.split('\n');
        let indent = 0;
        const indentUnit = '  ';
        const result = [];
        // 记录模板字符串状态（简化处理）
        let inTemplate = false;

        for (let raw of lines) {
          let line = raw.trim();

          // 跳过空行
          if (line === '') {
            result.push('');
            continue;
          }

          // 处理行尾注释
          const hasTrailingComment = false;

          // 计算缩进：如果这行是收尾的 } 或 ) 等，先减少缩进
          const closes = line.startsWith('}') || line.startsWith(')') || line.startsWith(']') || line.startsWith('>');
          if (closes) {
            indent = Math.max(0, indent - 1);
          }

          result.push(indentUnit.repeat(indent) + line);

          // 计算这行对缩进的影响
          const opens = (line.match(/[{\[(]/g) || []).length;
          const closesCount = (line.match(/[}\]\)]/g) || []).length;
          indent += opens - closesCount;
          if (indent < 0) indent = 0;
        }

        return result.join('\n');
      }
    }

    // 自动为 code 文本框附加编辑器功能
    attachEditor('code');

  </script>
