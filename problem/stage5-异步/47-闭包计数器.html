  <style>

    body { font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; background: #f5f5f5; color: #1f2328; padding: 16px; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

<body>
  <div class="header">
    <span class="tag">阶段 5 · JS 进阶（异步）</span>
    <h1>47. 闭包计数器</h1>
    <span class="difficulty">难度：简单</span>
  </div>

  <div class="layout">
    <div class="panel panel-left">
      <div class="card left-card">
        <h2>题目描述</h2>
        <div class="desc">
          <p>编写一个函数 <code>createCounter()</code>，返回一个计数器函数，每次调用返回递增的数字（从 1 开始）。</p>
        </div>
      </div>
      <div class="card left-card-big">
        <h2>示例与说明</h2>
        
      <div class="example">
        <strong>示例：</strong><br />
        <code>const c = createCounter(); c(); // 1, c(); // 2</code>
      </div>
      <div class="checklist">
        <strong>验收清单：</strong>
        <ul><li>每次调用数字 +1</li><li>不同计数器互不影响</li></ul>
      </div>
      </div>
      <div class="card left-card">
        <h2>控制台输出</h2>
        <div class="console" id="console"><span class="label">// 点击"运行"后，console.log 的输出会显示在这里</span></div>
      </div>
    </div>

    <div class="panel panel-right">
      <div class="card code-card">
        <h2>你的代码</h2>
        <p class="hint" style="margin-bottom:8px;">在下方编写代码，点击"运行"查看控制台输出。</p>
        <textarea id="code" spellcheck="false">// TODO: 编写 createCounter 函数

function createCounter() {
  // 提示：外层变量 + 返回内层函数（闭包）
}

// 测试代码（写完后运行）
const c = createCounter();
console.log(c()); // 1
console.log(c()); // 2
console.log(c()); // 3
</textarea>
        <div class="btn-row">
          <button class="btn" onclick="runCode()">运行</button>
          <button class="btn reset" onclick="resetCode()">重置</button>
          <button class="btn" onclick="markDone()" style="background:#d4a72c;">我完成了</button>
          <span id="nextArea" style="display:none;">
            <a href="48-手写 bind.html" class="btn next">下一题 →</a>
          </span>
        </div>
      </div>
    </div>
  </div>

  <script>
    const defaultCode = "// TODO: 编写 createCounter 函数\n\nfunction createCounter() {\n  // 提示：外层变量 + 返回内层函数（闭包）\n}\n\n// 测试代码（写完后运行）\nconst c = createCounter();\nconsole.log(c()); // 1\nconsole.log(c()); // 2\nconsole.log(c()); // 3\n";

    function runCode() {
      const code = document.getElementById('code').value;
      const consoleEl = document.getElementById('console');
      consoleEl.innerHTML = '<span class="label">// 运行中...</span>';

      // 用 new Function 执行（浏览器打开无 CSP 限制），同步重写 console.log 捕获输出
      const logs = [];
      const origLog = console.log;
      console.log = function (...args) {
        const parts = args.map(a => {
          if (typeof a === 'object' && a !== null) {
            try { return JSON.stringify(a); } catch (e) { return String(a); }
          }
          return String(a);
        });
        logs.push(parts.join(' '));
        origLog.apply(console, args);
      };

      try {
        const fn = new Function(code);
        fn();
      } catch (e) {
        console.log = origLog;
        consoleEl.innerHTML = '<span class="err">代码错误：' + escapeHtml(e.message) + '</span>';
        return;
      }

      // 延迟一段时间后收集（给异步代码留出时间）
      setTimeout(() => {
        console.log = origLog;
        if (logs.length === 0) {
          consoleEl.innerHTML = '<span class="label">// 没有输出。请确认代码里有 console.log，且异步逻辑已触发。</span>';
        } else {
          consoleEl.innerHTML = logs.map(l => '<span class="out">' + escapeHtml(l) + '</span>').join('\n');
        }
      }, 1500);
    }

    function escapeHtml(str) {
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function resetCode() {
      document.getElementById('code').value = defaultCode;
      document.getElementById('console').innerHTML = '<span class="label">// 点击"运行"后，console.log 的输出会显示在这里</span>';
    }

    function markDone() {
      document.getElementById('nextArea').style.display = 'block';
    }

    // ===== 编辑器增强：Tab 缩进 + Alt+Shift+F 格式化 =====
    function attachEditor(textareaId) {
      const ta = document.getElementById(textareaId);
      if (!ta) return;

      // Tab 键缩进
      ta.addEventListener('keydown', function (e) {
        if (e.key === 'Tab') {
          e.preventDefault();
          const start = ta.selectionStart;
          const end = ta.selectionEnd;
          const value = ta.value;
          const lineStart = value.lastIndexOf('\n', start - 1) + 1;

          if (e.shiftKey) {
            // Shift+Tab：反向缩进当前行（去掉行首最多 2 个空格）
            const lineEnd = value.indexOf('\n', start);
            const endPos = lineEnd === -1 ? value.length : lineEnd;
            const line = value.substring(lineStart, endPos);
            const match = line.match(/^[ \t]+/);
            if (match) {
              const remove = Math.min(2, match[0].length);
              const newValue = value.substring(0, lineStart) + value.substring(lineStart + remove);
              ta.value = newValue;
              const newPos = start - remove;
              ta.selectionStart = ta.selectionEnd = Math.max(lineStart, newPos);
            }
          } else {
            // 有选中文本：对每行整体缩进
            if (start !== end) {
              const selected = value.substring(start, end);
              const lines = selected.split('\n');
              const indented = lines.map(l => '  ' + l).join('\n');
              ta.value = value.substring(0, start) + indented + value.substring(end);
              ta.selectionStart = start;
              ta.selectionEnd = start + indented.length;
            } else {
              // 无选中：插入 2 个空格
              ta.value = value.substring(0, start) + '  ' + value.substring(end);
              ta.selectionStart = ta.selectionEnd = start + 2;
            }
          }
        }

        // Alt+Shift+F 格式化
        if (e.key === 'F' && e.altKey && e.shiftKey) {
          e.preventDefault();
          try {
            ta.value = formatJS(ta.value);
          } catch (err) {
            // 格式化失败则忽略
          }
        }
      });

      // 轻量 JS 格式化：基于缩进的简单美化
      function formatJS(code) {
        const lines = code.split('\n');
        let indent = 0;
        const indentUnit = '  ';
        const result = [];
        // 记录模板字符串状态（简化处理）
        let inTemplate = false;

        for (let raw of lines) {
          let line = raw.trim();

          // 跳过空行
          if (line === '') {
            result.push('');
            continue;
          }

          // 处理行尾注释
          const hasTrailingComment = false;

          // 计算缩进：如果这行是收尾的 } 或 ) 等，先减少缩进
          const closes = line.startsWith('}') || line.startsWith(')') || line.startsWith(']') || line.startsWith('>');
          if (closes) {
            indent = Math.max(0, indent - 1);
          }

          result.push(indentUnit.repeat(indent) + line);

          // 计算这行对缩进的影响
          const opens = (line.match(/[{\[(]/g) || []).length;
          const closesCount = (line.match(/[}\]\)]/g) || []).length;
          indent += opens - closesCount;
          if (indent < 0) indent = 0;
        }

        return result.join('\n');
      }
    }

    // 自动为 code 文本框附加编辑器功能
    attachEditor('code');

  </script>
</body>
