id: css-responsive
title: 响应式设计 — 适配不同的屏幕
track: fundamentals
chapter: css-layout
order: 5
mode: sandbox
musicAnalogy: 响应式设计就像**为不同规模的乐团改编同一首曲子**——大型交响乐团（桌面端）和钢琴独奏（手机）都能演绎同一首作品，区别只在于呈现方式。用 `@media` 查询就像为每种编制写一份适配的谱子。
listenTo: 拉威尔配器的穆索尔斯基《图画展览会》— 原为钢琴独奏，拉威尔将它改编为管弦乐版本。同一首曲子，两种编制，两种体验，完美诠释响应式设计。
