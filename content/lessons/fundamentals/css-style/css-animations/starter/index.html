<h1>🎬 动画舞台</h1>
<div class="stage">
  <div class="anim-card swing-card">
    <span class="card-icon">🎵</span>
    <strong>摇摆</strong>
    <p>像节拍器一样摆动</p>
  </div>
  <div class="anim-card fade-card">
    <span class="card-icon">🎭</span>
    <strong>淡入上浮</strong>
    <p>幕布升起的效果</p>
  </div>
  <div class="anim-card heart-card">
    <span class="card-icon">💗</span>
    <strong>心跳</strong>
    <p>缩放脉动的节奏</p>
  </div>
</div>
<div class="controls">
  <button id="pauseBtn">⏯ 暂停动画</button>
</div>
