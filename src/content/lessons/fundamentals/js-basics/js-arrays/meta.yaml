id: js-arrays
title: 数组 — 存储你的曲目列表
track: fundamentals
chapter: js-basics
order: 8
mode: sandbox
musicAnalogy: "数组就像一张**歌单/曲目列表**——把多个相关的值按顺序组织在一起。`[\"巴赫\", \"莫扎特\", \"贝多芬\"]` 就像写在纸上的三首曲目，用 `[0]` 可以取第一首，用 `.push()` 可以在末尾添加新曲目。"
listenTo: "柴可夫斯基《胡桃夹子》组曲 — 舞剧中包含\"进行曲\"\"糖果仙子之舞\"\"花之圆舞曲\"等多段舞曲，就像数组中的不同条目，每段有独立的索引和性格。"
estimatedMinutes: 0
