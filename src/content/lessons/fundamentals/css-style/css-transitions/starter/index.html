<h1>动画画廊</h1>
<div class="animation-group">
  <div class="anim-card fade-card">
    <span class="card-icon">🎵</span>
    <strong>渐强过渡</strong>
    <p>鼠标移到这里</p>
  </div>
  <div class="anim-card bounce-card">
    <span class="card-icon">🎹</span>
    <strong>跳动动画</strong>
    <p>鼠标移到这里</p>
  </div>
  <div class="anim-card auto-pulse">
    <span class="card-icon">💫</span>
    <strong>自动脉动</strong>
    <p>无限循环中...</p>
  </div>
</div>
