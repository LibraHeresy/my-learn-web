musicAnalogy: "交响乐团的指挥决定了哪个声部何时进入——小提琴先起，然后木管加入，最后铜管收尾。JavaScript 也有一个\"指挥家\"叫 Event Loop（事件循环），它决定了代码的执行顺序：谁先上场，谁等着，谁最后谢幕。"
listenTo: "拉威尔《波莱罗》— 同一段旋律在不同乐器间依次传递，每种乐器依次\"异步\"进入，完美诠释了顺序与调度的美感。"
