<h1>🔍 调试实验室</h1>
<div class="game-box">
  <p class="hint-text">我已经想好了一个 0~99 之间的数字 👀</p>
  <div class="input-row">
    <input type="number" id="guessInput" min="0" max="99" placeholder="输入你的猜测...">
    <button id="guessBtn">猜！</button>
  </div>
  <div class="info-row">
    <span>💯 得分：<strong id="scoreDisplay">100</strong></span>
    <span>🎯 尝试：<strong id="attemptsDisplay">0</strong></span>
  </div>
  <p id="message" class="message"></p>
  <button id="resetBtn" class="reset-btn">🔄 重新开始</button>
</div>
