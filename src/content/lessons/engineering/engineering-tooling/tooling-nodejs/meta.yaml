musicAnalogy: "学音乐之前，你得先有一件乐器。学前端工程化之前，你得先有 **Node.js**——它不是用来写代码的，而是用来**运行工具的**。就像钢琴本身不演奏，但有了它你才能弹出所有曲子。"
listenTo: 德彪西《月光》— 这首曲子的意境不在于复杂的技巧，而在于你按下第一个音符的瞬间——就像安装好 Node.js 后在终端输入第一行命令，一个全新的世界在你面前展开。
