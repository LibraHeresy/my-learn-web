# HTML 标签宝石

gem:
  id: html-tags
  name: HTML 标签宝石
  icon: 💎
  achievement: junior
  order: 1

levels:
  - level: 1
    type: normal
    threshold: 80
    name: 认识标签
    questions:
      - id: 1
        difficulty: 1
        question: 下面哪个是单标签，不需要写结束标签？
        options:
          - "<p>"
          - "<img>"
          - "<div>"
          - "<h1>"
        answer: 1
        explanation: "<img> 是单标签，不需要 </img>。p、div、h1 都是双标签，必须成对出现。"
      - id: 2
        difficulty: 1
        question: h1~h6 数字越大代表什么？
        options:
          - 字越大
          - 字越小
          - 颜色越深
          - 越重要
        answer: 1
        explanation: h1 最大（一级标题），h6 最小。数字越大，字号越小。
      - id: 3
        difficulty: 1
        question: 无序列表用哪个标签？
        options:
          - "<ol>"
          - "<list>"
          - "<ul>"
          - "<dl>"
        answer: 2
        explanation: ul=unordered list，前面是圆点。ol=ordered list，前面是数字。
      - id: 4
        difficulty: 1
        question: "表格中 <tr> 代表什么？"
        options:
          - 表格
          - 表头
          - 一行
          - 一个格子
        answer: 2
        explanation: tr=table row（表格行）。一个 tr 是一行，里面放 td 或 th。
      - id: 5
        difficulty: 1
        question: 下面哪个是合法的 HTML 注释？
        options:
          - // 注释
          - "/* 注释 */"
          - "<!-- 注释 -->"
          - "# 注释"
        answer: 2
        explanation: "HTML 注释格式是 <!-- -->。// 是 JS 注释，/* */ 是 CSS 注释。"

  - level: 2
    type: elite
    threshold: 70
    name: 场景选择
    questions:
      - id: 6
        difficulty: 2
        question: strong 和 b 都加粗，语义区别？
        options:
          - 完全相同
          - strong 表示重要内容有语义，b 只是视觉加粗
          - b 有语义
          - strong 已废弃
        answer: 1
        explanation: "strong 有语义，屏幕阅读器会重读。b 只是视觉加粗。就像重音记号 > 和用粗笔写谱子的区别。"
      - id: 7
        difficulty: 2
        question: article 和 section 什么时候用 article？
        options:
          - 都一样
          - 内容可独立分发复用时用 article
          - article 更大
          - section 已废弃
        answer: 1
        explanation: article 是可独立分发的内容块（如博客文章）。section 是页面内的主题区块。
      - id: 8
        difficulty: 2
        question: main 标签一个页面应出现几次？
        options:
          - 任意次数
          - 只应一次
          - 至少两次
          - 只在首页
        answer: 1
        explanation: main 代表页面主要内容，每个页面只应有一个 main。
      - id: 9
        difficulty: 2
        question: thead 和 tbody 分开写的好处？
        options:
          - 没有实际作用
          - 方便分别设置样式，浏览器可逐步渲染
          - 为了 SEO
          - 必须分开
        answer: 1
        explanation: 方便分别设置样式（如表头粘性），浏览器渲染大表格可逐步显示 tbody。
      - id: 10
        difficulty: 2
        question: audio 不写 controls 会怎样？
        options:
          - 无法播放
          - 能播放但没有播放/暂停按钮
          - 自动播放
          - 报错
        answer: 1
        explanation: controls 是布尔属性——写了就有控件，不写就没有。用户无法操作播放。
      - id: 11
        difficulty: 2
        question: 下面哪个是正确的 ul 嵌套？
        options:
          - "<ul><li>项目</li></ul>"
          - "<ul><div>项目</div></ul>"
          - "<li><ul>项目</ul></li>"
          - "<ol><li>项目</ol></li>"
        answer: 0
        explanation: ul 的直接子元素必须是 li。div 不能直接放在 ul 中。
      - id: 12
        difficulty: 2
        question: "<p>Hello<br>World</p> 渲染几行？"
        options:
          - 1行
          - 2行
          - 3行
          - 报错
        answer: 1
        explanation: br 在文字中插入换行。Hello 和 World 分两行显示，但在同一个 p 段落内。
      - id: 13
        difficulty: 2
        question: "<div class=\"a b c\"> 有几个 class？"
        options:
          - "1个，名字是\"a b c\""
          - 3个：a、b、c
          - 语法错误
          - 只有第一个生效
        answer: 1
        explanation: "class 用空格分隔多个类名。\"a b c\" 是三个独立的类。"

  - level: 3
    type: boss
    threshold: 65
    name: 结构纠错
    questions:
      - id: 14
        difficulty: 3
        question: 一段纯 div 导航页如何改写为语义化？
        options:
          - 把 class 名改成语义化即可
          - "<div class=\"header\">→<header> 等，换标签"
          - 全部换成 section
          - 不需要改
        answer: 1
        explanation: 把 div 换为对应的语义化标签 header/nav/main/footer。语义化让机器（搜索引擎、屏幕阅读器）理解页面结构。
      - id: 15
        difficulty: 3
        question: "<ul><p>列表项</p></ul> 有什么问题？"
        options:
          - 完全没问题
          - ul 的直接子元素只能是 li 不能是 p
          - 应该用 ol
          - p 不能放在任何列表里
        answer: 1
        explanation: "ul/ol 的直接子元素必须是 li。如果需要段落，写成 <ul><li><p>列表项</p></li></ul>。"
      - id: 16
        difficulty: 2
        question: "<img src=\"x.jpg\"> 和 <img src=\"x.jpg\" alt=\"\"> 区别？"
        options:
          - 完全一样
          - 前者不写 alt 阅读器可能读文件名，后者表示纯装饰阅读器跳过
          - 前者报错
          - alt 可以不写
        answer: 1
        explanation: "不写 alt 屏幕阅读器可能读文件名。alt=\"\" 表示纯装饰，让阅读器跳过。alt=\"描述\" 提供有意义的替代信息。"
      - id: 17
        difficulty: 3
        question: "<td colspan=\"2\"> 和 rowspan=\"2\" 各做什么？"
        options:
          - colspan 跨行 rowspan 跨列
          - colspan 水平跨列 rowspan 垂直跨行
          - 两者功能相同
          - 已废弃
        answer: 1
        explanation: colspan 横向跨越多列，rowspan 纵向跨越多行。值表示跨几个单元格。
      - id: 18
        difficulty: 2
        question: 如何在一个 audio 中提供 MP3 和 OGG 两种格式？
        options:
          - 写两个 audio
          - "内部用多个 <source> 标签"
          - 逗号分隔路径
          - 不支持多格式
        answer: 1
        explanation: "用多个 <source> 子标签，浏览器选第一个能播放的格式。就像备简谱和五线谱两份——哪个能读用哪个。"
      - id: 19
        difficulty: 2
        question: "<br> 和 <p> 都能换行，核心区别？"
        options:
          - br 是段落 p 是换行
          - br 行内换行无间距，p 段落分隔有间距
          - 完全相同
          - br 只能在 p 内
        answer: 1
        explanation: br 在文字内强制换行无段落间距。p 标记完整段落自动在段落间加间距。br 是单标签。
      - id: 20
        difficulty: 3
        question: "<p>第一段<p>第二段</p></p> 浏览器会渲染成什么？"
        options:
          - 嵌套的两个 p
          - 两个并列的 p（p 不能嵌套）
          - 报错
          - 只显示第一段
        answer: 1
        explanation: "p 不能嵌套。浏览器遇第二个 <p> 时自动闭合第一个，实际 DOM 中它们是两个并列 p。"
      - id: 21
        difficulty: 2
        question: "<button disabled> 和普通按钮区别？"
        options:
          - 前者灰色不可点击
          - 前者隐藏
          - 没有区别
          - 前者是旧写法
        answer: 0
        explanation: "disabled 让按钮变灰不可点击，表单提交时不发送它的值。用于\"条件不满足暂时不能点\"。"
      - id: 22
        difficulty: 2
        question: "<input readonly> 和 disabled 区别？"
        options:
          - 完全一样
          - readonly 可选中复制可提交值，disabled 完全不可交互不提交
          - readonly 更强
          - disabled 可提交
        answer: 1
        explanation: readonly 可选中复制，表单提交发送值。disabled 灰色不可交互提交时不发送。
      - id: 23
        difficulty: 1
        question: "&lt; 在 HTML 中显示为什么？"
        options:
          - <
          - ">"
          - "&"
          - 报错
        answer: 0
        explanation: "&lt;=less than，显示为 <。因为 < 在 HTML 中有特殊含义（标签开头），要用实体表示。"
      - id: 24
        difficulty: 2
        question: 链接新标签页打开 target 写什么？
        options:
          - "target=\"new\""
          - "target=\"_blank\""
          - "target=\"blank\""
          - "open=\"new\""
        answer: 1
        explanation: "target=\"_blank\" 在新标签页打开。_blank 是标准保留值。"
      - id: 25
        difficulty: 2
        question: "<meta charset=\"UTF-8\"> 不写会怎样？"
        options:
          - 页面无法显示
          - 中文可能乱码
          - 无影响
          - 图片加载失败
        answer: 1
        explanation: "charset 声明字符编码。不写浏览器可能用错编码导致中文乱码。就像乐谱不标\"五线谱\"还是\"简谱\"。"

