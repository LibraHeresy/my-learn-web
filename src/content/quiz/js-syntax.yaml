# JS 语法宝石

gem:
  id: js-syntax
  name: JS 语法宝石
  icon: 📝
  achievement: junior
  order: 5
levels:
  - level: 1
    type: normal
    threshold: 80
    name: 变量与类型
    questions:
      - id: 101
        difficulty: 1
        question: let 和 const 区别？
        options:
          - let 可重新赋值 const 不可；默认用 const
          - 完全相同
          - const 更快
          - let 已废弃
        answer: 0
        explanation: const 声明常量不可重新赋值。let 可重新赋值。最佳实践：默认 const，确定需改值时用 let。
      - id: 102
        difficulty: 1
        question: JS 有哪些基础数据类型？
        options:
          - string/number/boolean/undefined/null/symbol/bigint
          - 只有 string 和 number
          - 全部是 object
          - 只有 3 种
        answer: 0
        explanation: 7 种基本类型。typeof null 返回"object"(历史 bug)。函数 typeof 返回"function"(object 子类型)。
      - id: 103
        difficulty: 1
        question: '`"Hello"+" "+"World"` 结果？'
        options:
          - Hello World
          - '"Hello World"'
          - HelloWorld
          - 报错
        answer: 1
        explanation: + 用于字符串拼接：三个字符串连成 "Hello World"。
      - id: 104
        difficulty: 1
        question: '`let x; console.log(typeof x)` 输出？'
        options:
          - '"null"'
          - '"undefined"'
          - '"object"'
          - 报错
        answer: 1
        explanation: 声明了但没赋值的变量值为 undefined，typeof undefined 返回 "undefined"。
      - id: 105
        difficulty: 1
        question: '`"abc".toUpperCase()` 结果？'
        options:
          - '"abc"'
          - '"ABC"'
          - '"Abc"'
          - 报错
        answer: 1
        explanation: toUpperCase() 将所有字母转为大写。"abc"→"ABC"。toLowerCase() 反向操作。
      - id: 385
        difficulty: 1
        question: typeof NaN 返回什么？
        options:
          - '"number"'
          - '"NaN"'
          - '"undefined"'
          - '"object"'
        answer: 0
        explanation: NaN 虽然表示"Not a Number"，但 typeof NaN 返回 "number"。NaN 是 Number 类型的特殊值，表示无效的数值运算结果。
      - id: 386
        difficulty: 1
        question: '`String(123)` 和 `(123).toString()` 结果？'
        options:
          - 都返回 "123"
          - String(123)返回 123，(123).toString()报错
          - 都返回 123
          - String(123)报错
        answer: 0
        explanation: 两者都能将数字转为字符串 "123"。String()是全局函数可处理 null/undefined。.toString()是原型方法，null/undefined 调用会报错。
      - id: 387
        difficulty: 1
        question: '`Boolean("")` 和 `Boolean("hello")` 分别返回？'
        options:
          - true 和 true
          - false 和 true
          - true 和 false
          - false 和 false
        answer: 1
        explanation: 空字符串 "" 是 falsy 值→Boolean("")=false。非空字符串是 truthy→Boolean("hello")=true。
      - id: 388
        difficulty: 2
        question: null 和 undefined 的区别？
        options:
          - 完全相同
          - null 表示"空值"（有意赋空），undefined 表示"未定义"（变量未赋值）
          - null 是对象类型，undefined 是字符串类型
          - null 只能在函数中使用
        answer: 1
        explanation: null 通常由开发者显式赋值表示"无值"。undefined 是 JS 引擎自动赋予未初始化变量的值。null == undefined 为 true，null === undefined 为 false。
      - id: 389
        difficulty: 1
        question: '`typeof "hello"` 返回什么？'
        options:
          - '"string"'
          - '"text"'
          - '"object"'
          - '"char"'
        answer: 0
        explanation: typeof 运算符检测字符串类型返回 "string"。JS 中单引号和双引号以及模板字面量创建的字符串都是 string 类型。
      - id: 390
        difficulty: 2
        question: BigInt 类型的特点是什么？
        options:
          - 和普通数字完全相同
          - 可以安全表示任意大的整数，用 n 后缀声明如 9007199254740993n
          - 只能用在小数运算中
          - BigInt 会自动转换为 Number
        answer: 1
        explanation: BigInt 是 ES2020 引入的类型，可以表示超出 Number.MAX_SAFE_INTEGER 的整数。声明方式：数字后加 n，如 123n。BigInt 不能与 Number 混合运算。
      - id: 391
        difficulty: 1
        question: '`"hello".length` 返回什么？'
        options:
          - '5'
          - '6'
          - undefined
          - '"hello"'
        answer: 0
        explanation: .length 属性返回字符串的字符数量。"hello" 有 5 个字符。注意：某些 emoji 等特殊字符可能占多个码元。
      - id: 392
        difficulty: 2
        question: Symbol 类型的主要用途是什么？
        options:
          - 替代字符串
          - 创建唯一的属性键，避免命名冲突
          - 加速计算
          - 存储大数字
        answer: 1
        explanation: Symbol() 每次调用返回唯一的值，即使参数相同也不相等。常用于创建对象的私有属性键或定义不会与其他库冲突的属性名。Symbol.for("key") 可在全局注册表中共享。
  - level: 2
    type: elite
    threshold: 70
    name: 条件与循环
    questions:
      - id: 106
        difficulty: 2
        question: '"5"+3 和 "5"-3 结果？'
        options:
          - 53 和 2
          - 8 和 2
          - '"53"和"53"'
          - 报错
        answer: 0
        explanation: +遇字符串拼接："5"+3="53"。-只用于数字，先把"5"转数字再减：5-3=2。隐式类型转换。
      - id: 107
        difficulty: 2
        question: 0==false 和 0===false 结果？
        options:
          - true 和 false
          - true 和 true
          - false 和 false
          - false 和 true
        answer: 0
        explanation: '== 做类型转换 0→false→true。=== 严格比较 0(number)≠false(boolean)→false。推荐始终用===。'
      - id: 108
        difficulty: 2
        question: '`if(0){console.log("yes")}` 会输出吗？'
        options:
          - 会
          - 不会 0 是 falsy
          - 报错
          - 输出 undefined
        answer: 1
        explanation: 0/""/null/undefined/NaN/false 都是 falsy 值条件判断中视为 false。
      - id: 109
        difficulty: 2
        question: '`for(let i=0;i<3;i++){console.log(i)}` 输出？'
        options:
          - 0,1,2
          - 1,2,3
          - 0,1,2,3
          - 1,2
        answer: 0
        explanation: 循环 3 次 i=0/1/2。i<3 时成立，i=3 时退出。
      - id: 110
        difficulty: 2
        question: '`[1,2,3].forEach(n=>console.log(n*2))` 输出？'
        options:
          - 1,2,3
          - 2,4,6
          - '[2,4,6]'
          - 报错
        answer: 1
        explanation: forEach 对每个元素执行回调打印 n*2。不返回新数组(返回 undefined)。
      - id: 111
        difficulty: 2
        question: '`let score=85;score>=60?"及格":"不及格"` 结果？'
        options:
          - '"及格"'
          - '"不及格"'
          - 85
          - 报错
        answer: 0
        explanation: 三元运算符：条件?真值:假值。85>=60 为 true→"及格"。
      - id: 112
        difficulty: 2
        question: '`if("false"){console.log("yes")}` 会输出？'
        options:
          - 会非空字符串是 truthy
          - 不会"false"是 falsy
          - 报错
          - undefined
        answer: 0
        explanation: 非空字符串(含"false")是 truthy→执行 if 块。只有空字符串""是 falsy。
      - id: 113
        difficulty: 2
        question: '`10%3` 结果？'
        options:
          - 3
          - 1(取余)
          - 0
          - 10
        answer: 1
        explanation: '%=取余数(mod)。10÷3=3 余 1。常用于判断奇偶(n%2===0 偶数)。'
      - id: 114
        difficulty: 2
        question: '`3>2 && 2>1` 结果？'
        options:
          - true
          - false
          - 3
          - 报错
        answer: 0
        explanation: '&&=逻辑与(且)。两边都 true 结果 true。||=逻辑或(或)。!=逻辑非(取反)。'
      - id: 115
        difficulty: 2
        question: '`const arr=[1,2,3];arr.push(4)` 会报错吗？'
        options:
          - 会 const 不能改
          - 不会 const 保护引用数组内容可改
          - 取决于浏览器
          - push 对 const 无效
        answer: 1
        explanation: const 锁定变量绑定(不能 arr=新数组)，但数组/对象内容可修改。完全冻结用 Object.freeze()。
      - id: 393
        difficulty: 2
        question: switch 语句中 break 的作用是什么？如果没有 break 会发生什么？
        options:
          - break 可选，不影响执行
          - break 终止 switch；没有 break 会继续执行下一个 case（穿透）
          - break 必须省略
          - 没有 break 时 switch 自动退出
        answer: 1
        explanation: switch 的 case 默认有"穿透"（fall-through）行为。如果匹配的 case 后没有 break，会继续执行后面所有 case 的代码，直到遇到 break 或 switch 结束。这既是特性也是常见的 bug 来源。
      - id: 394
        difficulty: 2
        question: while 和 do...while 的核心区别？
        options:
          - 完全相同
          - while 先判断后执行；do...while 先执行一次再判断（至少执行一次）
          - do...while 更快
          - do...while 已废弃
        answer: 1
        explanation: while(条件){}：条件为 false 时一次都不执行。do{}while(条件)：循环体至少执行一次，然后判断条件是否继续。
      - id: 395
        difficulty: 2
        question: '`for...in` 和 `for...of` 的区别？'
        options:
          - 完全相同
          - for...in 遍历对象可枚举的键（含原型链）；for...of 遍历可迭代对象的值
          - for...of 遍历键
          - for...in 已废弃
        answer: 1
        explanation: for...in 遍历键名（适合普通对象）。for...of 遍历值（适合数组、字符串、Map、Set 等可迭代对象）。对数组用 for...in 会拿到索引字符串而非元素值，且会遍历原型属性。
      - id: 396
        difficulty: 2
        question: 循环中 break 和 continue 的区别？
        options:
          - 两者完全相同
          - break 终止整个循环；continue 跳过当前迭代进入下一次
          - break 跳过当前，continue 终止循环
          - 两者都只能用于 for 循环
        answer: 1
        explanation: break 立即退出整个循环，不再执行后续迭代。continue 跳过当前迭代的剩余代码，进入下一次循环条件判断。两者对 for/while/do...while 都有效。
      - id: 397
        difficulty: 2
        question: '`const result = false && "hello"` 结果是什么？为什么？'
        options:
          - 'true'
          - false（短路求值：&& 遇到 falsy 立即返回该值）
          - '"hello"'
          - undefined
        answer: 1
        explanation: '&& 是短路运算符：从左到右求值，遇到第一个 falsy 值立即返回该值，不再计算右侧。|| 相反：遇到第一个 truthy 值立即返回。常用于条件渲染和默认值设置。'
  - level: 3
    type: boss
    threshold: 60
    name: 函数与调试
    questions:
      - id: 116
        difficulty: 3
        question: function 不写 return 返回什么？
        options:
          - null
          - undefined
          - 报错
          - 0
        answer: 1
        explanation: 无 return 函数隐式返回 undefined。箭头函数一行表达式无{}时自动返回。
      - id: 117
        difficulty: 3
        question: 箭头函数 `(a,b)=>a+b` 等价什么？
        options:
          - function(a,b){return a+b}
          - let a+b
          - a=>b
          - function a(b){}
        answer: 0
        explanation: 箭头函数是 function 简写。单行可省略{}和 return。
      - id: 118
        difficulty: 3
        question: var 和 let 作用域区别？
        options:
          - 相同
          - var 函数作用域有提升，let 块级作用域({}内)无提升
          - let 函数作用域
          - var 已废弃
        answer: 1
        explanation: var 函数作用域有变量提升。let 块级作用域{}内有效无提升。推荐用 let/const 避免 var 混乱。
      - id: 119
        difficulty: 3
        question: 闭包是什么？`function o(){let x=1;return function(){return x}}` 内函数能访问 x？
        options:
          - 不能
          - 能内部函数"记住"外部变量=闭包
          - 只有外部函数运行时才能
          - 报错
        answer: 1
        explanation: 闭包=函数+它访问的外部变量。内函数"捕获"了 x，即使外部函数执行完毕 x 仍能被内函数访问。
      - id: 120
        difficulty: 3
        question: '`typeof null` 返回？为什么？'
        options:
          - '"null"'
          - '"object"——JS 早期实现 bug 为兼容保留至今'
          - '"undefined"'
          - '"nullpointer"'
        answer: 1
        explanation: typeof null==="object"是 JS 最早实现的 bug。null 的类型标记是 000 和对象相同。为兼容未修复。
      - id: 121
        difficulty: 3
        question: '`let a,b=5;console.log(a,b)` 输出？'
        options:
          - 5,5
          - undefined,5
          - 报错
          - null,5
        answer: 1
        explanation: let a,b=5 中只有 b 被赋值为 5，a 只声明未赋值=undefined。
      - id: 122
        difficulty: 3
        question: '`console.log(1);setTimeout(()=>console.log(2),0);console.log(3)` 顺序？'
        options:
          - 1,2,3
          - 1,3,2
          - 2,1,3
          - 3,2,1
        answer: 1
        explanation: 同步代码先执行 1→3。setTimeout 虽延迟 0 仍入任务队列等同步代码跑完才执行→2。事件循环。
      - id: 123
        difficulty: 3
        question: try/catch 基本语法和作用？
        options:
          - try{}else{}
          - try{}catch(e){}
          - catch{}try{}
          - try{}error{}
        answer: 1
        explanation: try 块放可能出错代码，catch(e)处理错误(程序不崩溃)。finally 块可选总是在最后执行。
      - id: 124
        difficulty: 3
        question: '`Cannot read property xxx of null` 什么错误？怎么修？'
        options:
          - 电脑坏了
          - 访问 null 的属性。先判 if(el)再操作或检查选择器是否正确
          - 正常警告
          - 重启浏览器
        answer: 1
        explanation: 最常因 querySelector 没找到元素返回 null→对 null 操作。修法：检查选择器拼写或先判 if(el)。
      - id: 125
        difficulty: 2
        question: '`!true` 结果？'
        options:
          - true
          - false
          - undefined
          - 报错
        answer: 1
        explanation: '!=逻辑非(取反)。!true=false !false=true。!!值可转布尔型。'
      - id: 126
        difficulty: 3
        question: '`let x=5;x=10` vs `const x=5;x=10` 区别？'
        options:
          - 都成功
          - 前者成功 x=10；后者报错 TypeError
          - 都报错
          - 后者静默失败
        answer: 1
        explanation: let 可重新赋值。const 不可重新赋值→TypeError。
      - id: 127
        difficulty: 3
        question: '`" hello ".trim().toUpperCase()` 结果？'
        options:
          - '" HELLO "'
          - '"HELLO"'
          - '"hello"'
          - 报错
        answer: 1
        explanation: trim()去两端空白→"hello"，toUpperCase()转大写→"HELLO"。方法链从左到右执行。
      - id: 128
        difficulty: 2
        question: '`[3,10,1,20].sort()` 结果？为什么？'
        options:
          - '[1,3,10,20]'
          - '[1,10,20,3]——sort 默认按字符串排序'
          - '[3,10,1,20]'
          - 报错
        answer: 1
        explanation: sort()默认转字符串按字典序排序→"10"<"3"因为"1"<"3"。数字排序需(a,b)=>a-b。
      - id: 129
        difficulty: 3
        question: '`const{name,age}=person` 是什么语法？'
        options:
          - 错误
          - 解构赋值——从对象中提取 name 和 age 属性
          - 创建新对象
          - TypeScript 特有
        answer: 1
        explanation: 对象解构：等价于 const name=person.name;const age=person.age;。简化代码。
      - id: 130
        difficulty: 2
        question: '`let name="小明";let Name="小红";console.log(name)` 输出？'
        options:
          - 小明(JS 区分大小写)
          - 小红
          - 报错
          - undefined
        answer: 0
        explanation: JS 变量名区分大小写。name 和 Name 是两个不同的变量。
      - id: 398
        difficulty: 3
        question: IIFE（立即执行函数表达式）的作用是什么？语法是？
        options:
          - 没有实际用途
          - 创建独立作用域避免变量污染全局；写法：(function(){...})() 或 (()=>{...})()
          - 提高代码运行速度
          - 只在 Node.js 中可用
        answer: 1
        explanation: IIFE（Immediately Invoked Function Expression）定义后立即执行。在 ES6 模块出现前用于创建私有作用域。现代代码中模块和块级作用域（let/const）已能解决大部分 IIFE 解决的问题，但 IIFE 在隔离作用域场景仍有使用。
      - id: 399
        difficulty: 3
        question: 函数声明和函数表达式的提升（hoisting）有什么区别？
        options:
          - 没有区别，都会提升
          - 函数声明整体提升（可在定义前调用）；函数表达式只提升变量名不提升函数体
          - 函数表达式提升更完整
          - 两者都不提升
        answer: 1
        explanation: function foo(){} 声明整体提升→可在定义前调用。var foo = function(){} 只有 var foo 部分提升（值为 undefined），赋值发生在运行时→提前调用报 TypeError。let/const 声明的函数表达式不提升（有 TDZ）。
      - id: 400
        difficulty: 2
        question: ES6 默认参数：`function greet(name = "World")` 中默认值何时生效？
        options:
          - 总是用默认值
          - 当参数为 undefined 时使用默认值
          - 当参数为空字符串时
          - 只在严格模式下
        answer: 1
        explanation: 默认参数在实参为 undefined 时生效。注意：传入 null、false、0、"" 等 falsy 值不会触发默认值，只有 undefined 才会。
      - id: 401
        difficulty: 3
        question: 剩余参数（Rest Parameters）：`function f(a, ...rest){}` 中 rest 是什么？
        options:
          - 一个数字
          - 包含从第二个参数开始所有实参的数组
          - 第一个参数的值
          - undefined
        answer: 1
        explanation: ...rest 将剩余的所有实参收集为一个真正的数组（非 arguments 类数组对象），可以在其中使用 map/filter 等数组方法。rest 必须是最后一个形参。
      - id: 402
        difficulty: 2
        question: 什么是纯函数（Pure Function）？以下哪个描述正确？
        options:
          - 函数有副作用
          - 相同输入始终返回相同输出，不产生副作用（不修改外部状态）
          - 纯函数必须使用箭头函数
          - 纯函数不能有参数
        answer: 1
        explanation: 纯函数两大特征：1) 相同输入永远返回相同输出（引用透明）；2) 不产生副作用（不修改外部变量、不操作 DOM、不发网络请求）。纯函数易于测试和推理，是函数式编程的基础。
  - level: 4
    type: boss
    threshold: 60
    name: ES6+ 现代语法
    questions:
      - id: 403
        difficulty: 2
        question: '`[1,2,3].map(x => x * 2)` 返回什么？'
        options:
          - '[1,2,3]'
          - '[2,4,6]'
          - '[1,4,9]'
          - undefined
        answer: 1
        explanation: map() 对数组每个元素执行回调，返回一个由回调返回值组成的新数组。原数组不变。这是函数式编程的核心方法之一。
      - id: 404
        difficulty: 2
        question: '`[1,2,3,4].filter(x => x > 2)` 返回什么？'
        options:
          - '[3,4]'
          - '[1,2]'
          - 'true'
          - '[1,2,3,4]'
        answer: 0
        explanation: filter() 保留使回调返回 true 的元素，返回新数组。[1,2,3,4]中大于2的是3和4。原数组不变。
