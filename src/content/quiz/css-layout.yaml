        question: "常见响应式布局模式？网格→堆叠模式怎么做？"
        options:
          - "只堆叠"
          - "桌面：grid-template-columns:repeat(3,1fr)（三列网格）。平板：repeat(2,1fr)（两列）。手机：1fr（单列堆叠）。用 auto-fill+minmax 更智能：repeat(auto-fill,minmax(250px,1fr)) 自动计算列数"
          - "用 position:absolute"
          - "响应式不需要"
        answer: 1
        explanation: "最优雅的方案是 repeat(auto-fill, minmax(250px, 1fr))：每个格子最小 250px，空间不够自动折行，无需手动写断点。这个一行代码的自适应网格是 Grid 最强大的特性之一。"
