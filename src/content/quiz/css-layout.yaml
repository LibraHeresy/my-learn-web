# CSS 布局宝石

gem:
  id: css-layout
  name: CSS 布局宝石
  icon: 📐
  achievement: junior
  order: 4

levels:
  - level: 1
    type: normal
    threshold: 80
    name: 布局概念
    questions:
      - id: 76
        difficulty: 1
        question: "display:flex 写在哪？"
        options:
          - "子元素"
          - "父容器"
          - "两者都要"
          - "html 上"
        answer: 1
        explanation: "display:flex 写在父元素(容器)上，其直接子元素自动变弹性项目。"
      - id: 77
        difficulty: 1
        question: "justify-content 控制什么方向？"
        options:
          - "垂直"
          - "主轴方向"
          - "对角线"
          - "文字方向"
        answer: 1
        explanation: "默认 flex-direction:row 时主轴是横向，justify-content 控制横向对齐。column 时主轴变纵向。"
      - id: 78
        difficulty: 1
        question: "position 有哪五种值？"
        options:
          - "top/right/bottom/left/center"
          - "static/relative/absolute/fixed/sticky"
          - "flex/grid/block/inline/float"
          - "px/em/rem/vw/vh"
        answer: 1
        explanation: "static(默认)/relative(相对自身)/absolute(相对祖先)/fixed(相对视口)/sticky(滚动吸附)。"
      - id: 79
        difficulty: 1
        question: "grid-template-columns:1fr 2fr 1fr 含义？"
        options:
          - "三列宽比 1:2:1"
          - "四列等宽"
          - "语法错误"
          - "两列"
        answer: 0
        explanation: "fr=fraction 份数。三列宽比 1:2:1，总 4 份，每列占 25%/50%/25%。"
      - id: 80
        difficulty: 1
        question: "@media 的作用？"
        options:
          - "设置动画"
          - "根据屏幕条件应用不同样式(响应式)"
          - "定义变量"
          - "引入字体"
        answer: 1
        explanation: "@media 媒体查询根据屏幕宽度等条件应用不同样式，实现响应式设计。"
      - id: 101
        difficulty: 1
        question: "block 元素和 inline 元素的核心区别？"
        options:
          - "完全相同"
          - "block 独占一行可设宽高（div/p/h1），inline 不换行宽高由内容决定不可设宽高（span/a）"
          - "inline 占更多空间"
          - "block 已废弃"
        answer: 1
        explanation: "block：独占整行、可设 width/height/margin/padding（四向）。inline：不换行、width/height 无效、margin/padding 仅水平方向生效垂直方向不影响布局。inline-block 兼顾：不换行但可设宽高。"
      - id: 102
        difficulty: 1
        question: "float 布局现在还用吗？"
        options:
          - "是主流布局方式"
          - "已基本被 Flexbox/Grid 取代。float 仅用于其原始目的：文字环绕图片"
          - "float 已废弃"
          - "float 最快"
        answer: 1
        explanation: "float 设计初衷是文字环绕图片，后来被滥用于整体页面布局（清浮动、等高列等问题）。现代布局用 Flexbox（一维）和 Grid（二维），float 回归本职：图文混排。"
      - id: 103
        difficulty: 2
        question: "display:inline-block 和 display:inline-flex 区别？"
        options:
          - "完全相同"
          - "inline-block=自身是块级盒子但在行内排列。inline-flex=弹性容器在行内排列，内部子元素参与 flex 布局"
          - "inline-flex 已废弃"
          - "无区别"
        answer: 1
        explanation: "inline-block：元素自身不换行但内部按正常文档流排列。inline-flex：元素自身不换行（行内级弹性容器），内部子元素参与 flex 布局。同理由有 inline-grid。"

  - level: 2
    type: elite
    threshold: 70
    name: Flex/Grid
    questions:
      - id: 81
        difficulty: 2
        question: "flex-direction:column 改变什么？"
        options:
          - "什么也不变"
          - "主轴变纵向，justify-content 和 align-items 轴向互换"
          - "元素消失"
          - "文字方向改变"
        answer: 1
        explanation: "column 让主轴由横向变纵向，justify-content 控制纵向对齐，align-items 控制横向对齐。"
      - id: 82
        difficulty: 2
        question: "flex:1 意思？"
        options:
          - "宽度 1px"
          - "占据剩余空间中 1 份"
          - "唯一元素时用"
          - "已废弃"
        answer: 1
        explanation: "flex:1=flex-grow:1;flex-shrink:1;flex-basis:0 简写。两子元素 flex:1 和 flex:2 宽比 1:2。"
      - id: 83
        difficulty: 2
        question: "space-between vs space-around vs space-evenly？"
        options:
          - "完全相同"
          - "between=贴两端均分/around=项两侧半倍间距/evenly=全部等距"
          - "between 已废弃"
          - "evenly 只用于 Grid"
        answer: 1
        explanation: "between 首尾贴边中间均分。around 每项左右有间距(两端间距是中间一半)。evenly 所有间隙完全相等。"
      - id: 84
        difficulty: 2
        question: "Grid 和 Flexbox 核心区别？"
        options:
          - "完全相同"
          - "Grid 二维(行列)适合页面布局，Flexbox 一维(行或列)适合组件排列"
          - "Flexbox 更好"
          - "Grid 已废弃"
        answer: 1
        explanation: "Grid 同时控制行和列=二维适合整体布局。Flexbox 只控制一个方向=一维适合组件内部排列。两者互补。"
      - id: 85
        difficulty: 2
        question: "relative 相对谁定位？absolute 呢？"
        options:
          - "relative 相对视口"
          - "relative 相对自身原位置，absolute 相对最近定位祖先"
          - "都相对父元素"
          - "都相对视口"
        answer: 1
        explanation: "relative 相对自身原位置偏移(原空间保留)。absolute 脱离流相对最近 position 非 static 的祖先。"
      - id: 86
        difficulty: 2
        question: "gap 属性做什么？Flexbox 和 Grid 都支持吗？"
        options:
          - "只用于 Grid"
          - "设置子元素间距，两者都支持"
          - "只用于 Flexbox"
          - "设置边框"
        answer: 1
        explanation: "gap 设置行列间距。早期 Flexbox 不支持 gap 但现在两者都支持。"
      - id: 87
        difficulty: 2
        question: "@media(max-width:768px)匹配什么？"
        options:
          - "宽度≥768px"
          - "宽度≤768px(手机/小平板)"
          - "所有设备"
          - "只匹配手机"
        answer: 1
        explanation: "max-width 表示\"宽度≤此值时应用\"=通常匹配手机。min-width 表示\"宽度≥此值时应用\"=通常匹配桌面。"
      - id: 88
        difficulty: 2
        question: "导航栏左边 Logo 右边链接→Flexbox 写法？"
        options:
          - "全 float"
          - "nav{display:flex;justify-content:space-between}"
          - "用 position:absolute"
          - "不可能实现"
        answer: 1
        explanation: "display:flex+space-between。左边元素自然靠左，右边元素靠右，中间空白自动填充。"
      - id: 104
        difficulty: 2
        question: "align-items 和 align-content 区别？（Flex/Grid 都适用）"
        options:
          - "完全相同"
          - "align-items 单行/单列内对齐；align-content 多行/多列的整体分布（需 flex-wrap:wrap 或多行 grid 才生效）"
          - "align-content 已废弃"
          - "只用于 Grid"
        answer: 1
        explanation: "align-items=交叉轴上每行/列内部的对齐（stretch/center/flex-start）。align-content=多行/列在交叉轴上的分布方式（space-between/center/stretch）。单行时 align-content 不生效。"
      - id: 105
        difficulty: 2
        question: "justify-self 和 align-self 的作用？在 Flex 和 Grid 中都生效吗？"
        options:
          - "都生效"
          - "align-self 在 Flex 和 Grid 都生效（覆盖父容器 align-items 对单个子元素的设置）。justify-self 仅在 Grid 中生效，Flex 中无效果"
          - "justify-self 都生效"
          - "已废弃"
        answer: 1
        explanation: "align-self 在 Flex 和 Grid 中都可单独控制某子元素的交叉轴对齐。justify-self 只在 Grid 中生效（控制某个 grid item 的主轴对齐），在 Flex 中无效（Flex 中主轴子项位置需用 margin:auto 技巧）。"
      - id: 106
        difficulty: 3
        question: "grid-template-areas 的用法？举例：header/sidebar+content/footer 三行布局。"
        options:
          - "head/content/foot"
          - "用命名网格区域：grid-template-areas:\"header header\" \"sidebar content\" \"footer footer\" + grid-template-columns:200px 1fr + grid-template-rows:auto 1fr auto"
          - "和 flex 一样"
          - "已废弃"
        answer: 1
        explanation: "grid-template-areas 用可视化 ASCII 方式定义布局，然后各元素用 grid-area:名称 归位。这是 Grid 最直观的特性：像在纸上画格子，所见即所得。"
      - id: 107
        difficulty: 2
        question: "place-items 和 place-content 是什么？"
        options:
          - "没有这些属性"
          - "place-items = align-items + justify-items 的简写。place-content = align-content + justify-content 的简写。如 place-items:center = 居中"
          - "只用于 inline"
          - "已废弃"
        answer: 1
        explanation: "place-* 系列是简写属性：place-items、place-content、place-self。语法：place-items: <align-items> <justify-items>。只写一个值则两者同值。place-items:center 是快速居中技巧。"

  - level: 3
    type: boss
    threshold: 60
    name: 响应式实战
    questions:
      - id: 89
        difficulty: 3
        question: "transition 需要哪些要素？"
        options:
          - "只需属性名"
          - "属性+时长(至少)"
          - "必须 4 个值"
          - "只需时长"
        answer: 1
        explanation: "transition 至少需要：transition-property(哪个属性)+transition-duration(多久)。可选：timing-function(曲线)+delay(延迟)。"
      - id: 90
        difficulty: 3
        question: "transition 和 animation 核心区别？"
        options:
          - "完全相同"
          - "transition 需触发(如hover)只两态；animation 自动播放可多帧"
          - "animation 更简单"
          - "transition 已废弃"
        answer: 1
        explanation: "transition 被触发(hover等)只 A→B 过渡。animation 主动播放通过@keyframes 定义任意多帧可循环。"
      - id: 91
        difficulty: 2
        question: "ease/linear/ease-in/ease-out 区别？"
        options:
          - "完全相同"
          - "ease 慢快慢(默认)/linear 匀速/ease-in 慢→快/ease-out 快→慢"
          - "ease 已废弃"
          - "linear 只用于 rotate"
        answer: 1
        explanation: "ease 默认最自然。linear 全程匀速。ease-in 慢速开始。ease-out 慢速结束。"
      - id: 92
        difficulty: 3
        question: "animation-fill-mode:forwards vs none？"
        options:
          - "forwards 停最后一帧 none 回初始(闪回)"
          - "完全相同"
          - "forwards 已废弃"
          - "none 不播放"
        answer: 0
        explanation: "forwards 动画结束后保持最后一帧样式。none 回到动画前初始状态(会闪回)。backwards 开始前就应用第一帧。"
      - id: 93
        difficulty: 3
        question: "无限旋转动画 @keyframes 怎么写（经典 transform:rotate() 写法）？"
        options:
          - "@keyframes s{from{rotate:0}to{rotate:360deg}}"
          - "@keyframes s{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}"
          - "keyframes s{transform:spin}"
          - "@keyframes s{0%{rotate:0}100%{rotate:1turn}}"
        answer: 1
        explanation: "动画需配合 animation:s 2s linear infinite 使用。经典写法用 transform:rotate() 定义关键帧（from/to 与 0%/100% 等价）。独立 rotate 属性在现代浏览器同样合法，但本题限定经典 transform:rotate() 写法。"
      - id: 94
        difficulty: 3
        question: "为什么做动画优先用 transform 而非 left/top？"
        options:
          - "无区别"
          - "transform 只触发合成(GPU加速)；left/top 触发重排性能差"
          - "transform 更简单"
          - "left/top 已废弃"
        answer: 1
        explanation: "浏览器渲染：重排→重绘→合成。left/top 触发重排最贵。transform 只触发合成 GPU 处理性能最好。"
      - id: 95
        difficulty: 2
        question: "animation-duration 单位？1.5s=1500ms？"
        options:
          - "s 和 ms，1.5s=1500ms 等价"
          - "只能用 s"
          - "只能用 ms"
          - "1.5s=150ms"
        answer: 0
        explanation: "可用 s(秒)或 ms(毫秒)。1s=1000ms，1.5s=1500ms 完全等价。"
      - id: 96
        difficulty: 2
        question: "响应式是什么？怎么做？"
        options:
          - "一种布局模式"
          - "让网页在不同屏幕都好看。用 @media 断点+弹性单位"
          - "只能用 Grid"
          - "用 JS 判断屏幕"
        answer: 1
        explanation: "响应式=不同屏幕不同布局。核心：@media 媒体查询+弹性单位(%,vw,fr)+flex/grid 弹性布局+移动优先。"
      - id: 97
        difficulty: 3
        question: "animation-direction:alternate 效果？"
        options:
          - "反向播放"
          - "奇数遍正向偶数遍反向来回交替"
          - "加速播放"
          - "只播放反向"
        answer: 1
        explanation: "alternate 奇数遍(1,3,5)正向偶数遍(2,4,6)反向。配合 infinite 做来回效果。"
      - id: 98
        difficulty: 2
        question: "flex-wrap 做什么？"
        options:
          - "控制对齐"
          - "是否允许子元素换行"
          - "设置间距"
          - "已废弃"
        answer: 1
        explanation: "nowrap(默认)不换行子元素被压缩。wrap 允许换行。通常配合 flex-wrap:wrap 实现自适应布局。"
      - id: 99
        difficulty: 3
        question: "sticky 定位的效果？使用条件？"
        options:
          - "固定在视口"
          - "滚动到指定位置后固定吸附。需设 top/left 等值"
          - "和 fixed 完全一样"
          - "已废弃"
        answer: 1
        explanation: "sticky=滚动时先正常排列，到达阈值(如 top:0)后吸附固定。常用于吸顶导航栏。父元素不能设 overflow:hidden。"
      - id: 100
        difficulty: 2
        question: "repeat(3,1fr) 和 1fr 1fr 1fr 等价吗？"
        options:
          - "等价"
          - "不等价 repeat 更慢"
          - "1fr 1fr 1fr 语法错"
          - "repeat 已废弃"
        answer: 0
        explanation: "完全等价。repeat(次数,值)是简写。repeat(3,1fr)=1fr 1fr 1fr。repeat(auto-fill,minmax(200px,1fr))更强大。"
      - id: 108
        difficulty: 3
        question: "min-width 和 max-width 在响应式设计中各自的作用？"
        options:
          - "完全相同"
          - "max-width 限制最大宽度（防止大屏过宽）。min-width 确保最小宽度（小屏时配合滚动）。响应式中 max-width 更常用"
          - "只用 min-width"
          - "已废弃"
        answer: 1
        explanation: "max-width 限制元素最大宽度（如文章正文 max-width:65ch 保持最佳阅读行长）。min-width 设定最小宽度。移动优先设计中常用 min-width 媒体查询（从小屏开始逐级增强）。"
      - id: 109
        difficulty: 3
        question: "移动优先（Mobile First）设计策略是什么意思？CSS 怎么写？"
        options:
          - "先做桌面版"
          - "基础 CSS 为移动端写（无媒体查询=默认移动布局），然后用 min-width 媒体查询逐级为更大屏幕添加增强样式"
          - "只做手机"
          - "先做平板"
        answer: 1
        explanation: "移动优先=默认样式是移动端布局（最简），用 @media(min-width:768px) 逐步添加平板样式，@media(min-width:1024px) 添加桌面增强。优点：代码更简洁、性能更好（移动端不加载桌面 CSS）、内容优先。"
      - id: 110
        difficulty: 3
        question: "clamp() 函数的作用？举例 clamp(1rem, 2vw, 2rem)。"
        options:
          - "取平均值"
          - "设定最小值、首选值、最大值。clamp(1rem, 2vw, 2rem)=字体最小1rem，最大2rem，中间按视口2vw缩放但不超过上下限"
          - "和 min() 相同"
          - "已废弃"
        answer: 1
        explanation: "clamp(MIN, VAL, MAX) 是 min/max 的组合：取 VAL 但限制在 MIN~MAX 之间。实现流畅的响应式排版无需媒体查询断点。配合 CSS 变量可打造完善的流畅排版系统。"

  - level: 4
    type: boss
    threshold: 60
    name: 响应式布局进阶
    questions:
      - id: 111
        difficulty: 2
        question: "@media 媒体查询常见断点有哪些？"
        options:
          - "只有 768px"
          - "常见断点：576px（大手机）/ 768px（平板）/ 992px（小平板横屏）/ 1024px（桌面）/ 1200px（大桌面）/ 1400px（超大屏）。但应根据内容需求而非设备定义断点"
          - "只有 1024px"
          - "没有标准"
        answer: 1
        explanation: "断点应根据内容需要而非特定设备。\"当布局开始变丑时\"就是该加断点的时候。经典做法：先缩小浏览器窗口，当内容挤在一起/文字过长时在那里加断点。内容驱动断点 > 设备驱动断点。"
      - id: 112
        difficulty: 2
        question: "min-width 和 max-width 媒体查询分别对应什么设计策略？"
        options:
          - "完全相同"
          - "min-width=移动优先（从小屏向大屏增强）。max-width=桌面优先（从大屏向小屏降级）。推荐移动优先"
          - "max-width 更好"
          - "只用一个"
        answer: 1
        explanation: "移动优先用 min-width：/* 基础=移动 */ → @media(min-width:768px){/* 平板增强 */} → @media(min-width:1024px){/* 桌面增强 */}。桌面优先用 max-width。移动优先代码更简洁且强制你设计核心内容。"
      - id: 113
        difficulty: 3
        question: "Container Queries（容器查询）和 Media Queries 有什么区别？"
        options:
          - "完全相同"
          - "Media Query 基于视口宽度。Container Query 基于父容器宽度→组件根据自身所在容器自适应而非整个页面宽度"
          - "Container Query 已废弃"
          - "只用于 Firefox"
        answer: 1
        explanation: "Container Queries（@container）是 CSS 新特性：@media(width<768px) 基于整个窗口；@container(min-width:300px) 基于某容器的宽度。这让组件独立响应式化——同一个卡片组件在侧边栏（窄）和主内容区（宽）自动展示不同布局。"
      - id: 114
        difficulty: 3
        question: "如何启用 Container Queries？"
        options:
          - "直接用 @container"
          - "先给容器设 container-type（inline-size/normal/size），再用 @container 查询。如：.card-container{container-type:inline-size} + @container(min-width:400px){...}"
          - "不需要设置"
          - "已废弃"
        answer: 1
        explanation: "两步：1) 容器定义 container-type:inline-size（只监听宽度）/ size（监听宽高）/ normal（不查询尺寸但可查询 style）；2) @container(min-width:400px){...} 写查询规则。还可命名容器：container-name:\"card\"，然后用 @container card(...) 精确查询。"
      - id: 115
        difficulty: 2
        question: "<picture> 和 <img srcset> 在响应式图片中怎么用？"
        options:
          - "不可用"
          - "srcset 根据屏幕像素密度（1x/2x）或宽度自动切换不同分辨率图片。picture 基于媒体查询切换不同比例/裁切的图片（Art Direction 艺术指导）"
          - "只用于视频"
          - "已废弃"
        answer: 1
        explanation: "srcset=同一图片不同分辨率（根据屏幕宽度或 DPR 切换）。picture>source media=不同裁切/构图的图片（如手机上方形图桌面宽图）。两者配合：手机加载小图+竖构图，桌面加载大图+横构图，节省带宽且展示最佳。"
      - id: 116
        difficulty: 2
        question: "响应式字体大小怎么写？（三种方法）"
        options:
          - "只用 px"
          - "1) clamp()+vw（流体排版）；2) 媒体查询断点；3) CSS 变量+媒体查询组合。如 font-size:clamp(0.875rem,0.8rem+0.5vw,1.25rem)"
          - "只用 em"
          - "不需要"
        answer: 1
        explanation: "三种方法：1) 流体排版 clamp()+vw（优雅流畅无断点）；2) 经典媒体查询（精确控制）；3) CSS 变量：:root{--fs-body:1rem} @media(...){:root{--fs-body:1.125rem}}（集中管理）。推荐用 clamp 或变量方案。"
      - id: 117
