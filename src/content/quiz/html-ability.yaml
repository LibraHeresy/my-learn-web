# HTML 能力宝石

gem:
  id: html-ability
  name: HTML 能力宝石
  icon: 🏷️
  achievement: junior
  order: 2

levels:
  - level: 1
    type: normal
    threshold: 80
    name: 属性识别
    questions:
      - id: 26
        difficulty: 1
        question: "class 用 . 还是 # 选中？id 呢？"
        options:
          - "class 用 . id 用 #"
          - "class 用 # id 用 ."
          - 都用 .
          - "都用 #"
        answer: 0
        explanation: "类选择器用 .class名，ID 选择器用 #id名。记忆：class=分类(点号)，id=身份证(井号)。"
      - id: 27
        difficulty: 1
        question: 下面哪些是全局属性？
        options:
          - src 和 href
          - class 和 id
          - alt 和 controls
          - colspan 和 rowspan
        answer: 1
        explanation: class 和 id 是全局属性，任何标签都能用。src 是 img/audio/video 特有，href 是 a/link 特有。
      - id: 28
        difficulty: 1
        question: 布尔属性需要写值吗？举一个例子
        options:
          - "需要，如 disabled=\"true\""
          - 不需要，只要出现就生效如 disabled
          - 必须有值
          - 布尔属性已废弃
        answer: 1
        explanation: "布尔属性只关心\"有\"还是\"没有\"，不关心值。disabled/checked/controls/loop 都是布尔属性。"
      - id: 29
        difficulty: 1
        question: "data-* 属性做什么？JS 怎么读？"
        options:
          - 设置样式
          - 存储自定义数据，用 dataset 读取
          - 定义动画
          - 声明编码
        answer: 1
        explanation: "data-* 在元素上存自定义信息，JS 通过 element.dataset.xxx 读取。<div data-id=\"1\">→el.dataset.id。"
      - id: 30
        difficulty: 2
        question: class 可以多个元素共用吗？id 呢？
        options:
          - 都可以
          - class 可共用，id 必须唯一
          - class 必须唯一
          - 都不可以
        answer: 1
        explanation: class=琴竹分类，多根弦可共用。id=琴弦编号，全琴唯一。

  - level: 2
    type: elite
    threshold: 70
    name: 属性应用
    questions:
      - id: 31
        difficulty: 2
        question: 一个元素可以有多个 class 吗？
        options:
          - 不可以
          - 可以，用空格分隔
          - 可以，用逗号分隔
          - 可以，写多个 class 属性
        answer: 1
        explanation: "class=\"card highlight active\"——用空格分隔多个类名，这个元素同时属于三个类。"
      - id: 32
        difficulty: 2
        question: style 属性 vs 外部 CSS——为什么推荐后者？
        options:
          - style 更快
          - 外部 CSS 可复用/好维护/职责分离
          - 没有区别
          - style 是旧写法
        answer: 1
        explanation: 内联 style 只作用一个元素无法复用且优先级过高难覆盖。外部 CSS 统一管理维护方便。
      - id: 33
        difficulty: 2
        question: "hidden 属性和 display:none 效果一样吗？"
        options:
          - 完全一样
          - "hidden 是 HTML 属性层隐藏，display:none 是 CSS 层"
          - hidden 只隐藏文字
          - "display:none 不可恢复"
        answer: 1
        explanation: "效果类似。但 hidden 优先级低——若 CSS 设 display:block，hidden 会被覆盖。"
      - id: 34
        difficulty: 2
        question: title 属性(全局属性)的作用？
        options:
          - 设置页面标题
          - 鼠标悬停时显示提示文字
          - 定义 CSS 样式
          - 声明字符编码
        answer: 1
        explanation: title 是全局属性——任何元素悬停时显示提示。和 alt 不同：alt 是图片加载失败时显示，title 是悬停时显示。
      - id: 35
        difficulty: 2
        question: "属性值必须加引号吗？<img src=photo.jpg> 合法吗？"
        options:
          - 必须加
          - 不必须，HTML5 允许不加引号
          - 只有数字值可省略
          - 不加引号是 HTML4
        answer: 1
        explanation: HTML5 允许属性值不加引号（只要值中无空格或特殊字符）。但最佳实践是始终加引号避免意外。
      - id: 36
        difficulty: 2
        question: 一个元素能同时有 class 和 id 吗？
        options:
          - 不能
          - 可以，它们不冲突
          - 只能二选一
          - id 会覆盖 class
        answer: 1
        explanation: "class 和 id 可以同时存在。class 用于样式分组，id 用于唯一标识和 JS 选取。<div class=\"card\" id=\"card1\">"
      - id: 37
        difficulty: 2
        question: "checked=\"false\" 和完全不写 checked 的区别？"
        options:
          - 前者不选中
          - 前者仍然选中！布尔属性只看出现不看值
          - 完全相同
          - "checked=\"false\" 语法错误"
        answer: 1
        explanation: "checked=\"false\" 仍然是选中状态！布尔属性只关心\"有没有出现\"不看值。想不选中需要完全移除 checked。"

  - level: 3
    type: boss
    threshold: 65
    name: 表单实战
    questions:
      - id: 38
        difficulty: 3
        question: "<img src=\"x.jpg\" alt=\"\"> 图片加载失败时用户看到什么？"
        options:
          - 看到空 alt 文字
          - 看到裂图图标无替代文字
          - 看到空白
          - 看到文件名
        answer: 1
        explanation: "alt=\"\" 表示纯装饰，阅读器跳过。加载失败时浏览器显示裂图图标无替代文字。alt=\"描述\" 才会显示描述。"
      - id: 39
        difficulty: 3
        question: "<a href=\"wikipedia.org\"> 和 href=\"https://wikipedia.org\"> 区别？"
        options:
          - 都正常跳转
          - 前者被当作相对路径(网站内文件)，后者正常跳转
          - 都报错
          - 前者自动补全
        answer: 1
        explanation: "无 https:// 时浏览器把 wikipedia.org 当作你网站内的相对路径→404。必须写完整 URL。"
      - id: 40
        difficulty: 3
        question: "<label for=\"email\"> 但 input id=\"userEmail\"→点 label 会？"
        options:
          - 正常聚焦
          - 什么都不发生，for 和 id 不匹配
          - 自动纠错
          - 聚焦最近输入框
        answer: 1
        explanation: "label 的 for 必须等于 input 的 id——这对\"钥匙和锁\"必须一模一样才会生效。不匹配点击无反应。"
      - id: 41
        difficulty: 2
        question: radio 同组互斥靠什么属性？
        options:
          - type
          - name 属性相同
          - id 相同
          - value 相同
        answer: 1
        explanation: 同组 radio 的 name 必须相同，浏览器据此判断互斥——选一个其他自动取消。
      - id: 42
        difficulty: 2
        question: placeholder 和 value 区别？
        options:
          - placeholder 是默认值
          - placeholder 是灰色提示不提交，value 是实际值会提交
          - 完全相同
          - value 是提示 placeholder 是值
        answer: 1
        explanation: placeholder 是输入框为空时的灰色提示，用户输入后消失且不提交。value 是输入框实际值，会提交。
      - id: 43
        difficulty: 3
        question: "<input type=\"checkbox\" checked> 选中的值是什么？"
        options:
          - "\"checked\""
          - "不写 value 时默认为 \"on\""
          - true
          - false
        answer: 1
        explanation: "checkbox 不写 value 属性时，选中提交的默认值是 \"on\"。想提交自定义值需设 value=\"自定义值\"。"
      - id: 44
        difficulty: 2
        question: fieldset+legend 的用途？
        options:
          - 已废弃
          - 把表单控件分组圈起来，legend 写组标题
          - 设置样式
          - 验证表单
        answer: 1
        explanation: fieldset 把一组相关表单控件圈在一起(画框)，legend 是框上的标题。让表单更有条理。
      - id: 45
        difficulty: 3
        question: "<input required> 和 <input pattern=\"[0-9]+\"> 各做什么？"
        options:
          - required 必填，pattern 正则校验格式
          - 完全相同
          - required 已废弃
          - pattern 是密码专用
        answer: 0
        explanation: required 表示该字段必填。pattern 用正则表达式限制输入格式。两者可组合：必填且必须匹配格式。

