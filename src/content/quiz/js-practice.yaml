          - console.table 以表格形式展示对象数组，更直观；console.group/groupEnd 创建可折叠的日志分组
          - console.table 只能用于数字
          - 已废弃
        answer: 1
        explanation: console.table([{name:"A", age:20}, {name:"B", age:25}]) 以表格呈现数组对象，列对齐。console.group("用户操作") + console.log(...) + console.groupEnd() 将相关日志分组，可折叠展开。这些都是专业调试的重要工具。
