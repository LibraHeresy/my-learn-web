        explanation: 在代码中插入 debugger; 语句，浏览器 DevTools 打开时会在此暂停执行（等同手动断点）。优点：可在特定条件下用 if(condition){debugger;} 做条件断点。注意：生产环境部署前应移除所有 debugger 语句。
      - id: 477
        difficulty: 2
        question: try/catch/finally 完整错误处理模式？finally 何时一定执行？
        options:
          - finally 在 catch 后才执行
          - try { 可能出错的代码 } catch(e) { 错误处理 } finally { 无论是否出错都执行的清理代码 }。finally 在 try/catch 之后，即使 try 中有 return 也会执行
          - finally 可选
        answer: 1
        explanation: finally 块中的代码无论 try 是否抛出错误、catch 是否执行，甚至 try/catch 中有 return，都会在方法返回前执行。适合做清理操作：关闭连接、移除 loading 状态等。唯一的例外是 try 中调用了 process.exit() 这类暴力退出。
