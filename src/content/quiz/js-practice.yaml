        question: 深拷贝的几种方式：`JSON.parse(JSON.stringify(obj))` 和 `structuredClone(obj)` 的区别？
        options:
          - 完全相同
          - JSON 方式无法处理函数、undefined、Symbol、Date、RegExp、循环引用；structuredClone 支持更多类型（含循环引用）但也不支持函数和 Symbol
          - structuredClone 已废弃
          - JSON 方式可以拷贝一切
        answer: 1
        explanation: JSON.parse(JSON.stringify()) 简单但有大量限制：丢失 undefined/函数/Symbol/Date 转字符串/NaN→null/infinity→null/循环引用报错。structuredClone() 是新的原生 API（2022+），支持循环引用、Date、RegExp、Map、Set、ArrayBuffer 等，但同样不支持函数。深度场景考虑 lodash.cloneDeep。
