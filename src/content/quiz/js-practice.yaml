      - id: 480
        difficulty: 2
        question: '`performance.now()` 和 `Date.now()` 的区别？适用于什么场景？'
        options:
          - 完全相同
          - performance.now() 返回高精度时间戳（微秒级），适合性能测量；Date.now() 返回毫秒级时间戳，适合业务逻辑
          - performance.now() 精度更低
          - Date.now() 已废弃
        answer: 1
        explanation: performance.now() 返回从页面加载开始的高精度时间（微秒级别），不受系统时间调整影响，专门用于性能测量。Date.now() 返回 Unix 时间戳（毫秒），受系统时钟影响。做性能测试始终用 performance.now()。
      - id: 481
        difficulty: 3
        question: 前端常见的内存泄漏场景有哪些？
        options:
          - JS 不会内存泄漏
          - 遗忘的定时器/事件监听器、闭包中保持大对象引用、DOM 引用保留（已删除的 DOM 被 JS 变量引用）、全局变量累积
          - 只有 IE 有
          - 内存泄漏自动修复
        answer: 1
        explanation: 常见泄漏：1) setInterval 忘记 clearInterval；2) addEventListener 忘记 removeEventListener；3) 闭包持有不再需要的 DOM 引用；4) 全局变量或模块作用域变量不断累积数据；5) 分离的 DOM 树（JS 仍引用已从页面移除的 DOM）。现代浏览器 DevTools 的 Memory 面板可检测泄漏。
