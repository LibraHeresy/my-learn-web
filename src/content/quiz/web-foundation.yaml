# Web 基石宝石

gem:
  id: web-foundation
  name: Web 基石宝石
  icon: ⭐
  achievement: junior
  order: 7

levels:
  - level: 1
    type: achievement-boss
    threshold: 60
    name: 初级大决战
    questions:
      - id: 156
        difficulty: 3
        question: "HTML+CSS 混合：给一个导航栏需求(左边logo右边链接)，最合适的标签和CSS？"
        options:
          - "<div>+float"
          - "<nav>+display:flex+space-between"
          - "<table>布局"
          - "<header>+position:absolute"
        answer: 1
        explanation: "语义化 nav 包裹+flex 布局是现代标准做法。"
      - id: 157
        difficulty: 3
        question: "HTML+CSS：一个表单 label 点击没反应→可能原因？"
        options:
          - "JS 没加载"
          - "label 的 for 和 input 的 id 不匹配"
          - "CSS 样式问题"
          - "浏览器版本太旧"
        answer: 1
        explanation: "label for 必须等于 input id——这对钥匙锁必须一模一样才会生效。"
      - id: 158
        difficulty: 3
        question: "HTML+CSS：以下哪项能实现三列等宽布局？"
        options:
          - "<table>"
          - "display:grid;grid-template-columns:repeat(3,1fr)"
          - "float:left;width:33%"
          - "以上都可以"
        answer: 3
        explanation: "三种都能实现三列等宽布局。Grid 最现代，Flexbox 也可，table 过时但不影响效果。"
      - id: 159
        difficulty: 3
        question: "HTML+CSS：图片加载失败不显示裂图图标应设置什么？"
        options:
          - "style=\"hide-on-error\""
          - "alt=\"\"且设置 onerror 替换"
          - "无法实现"
          - "display:none"
        answer: 1
        explanation: "alt=\"\"不让阅读器读文件名。CSS/JS 可监听 error 事件隐藏或替换裂图。"
      - id: 160
        difficulty: 3
        question: "HTML+CSS：移动端页面在手机上缩放异常最常见原因？"
        options:
          - "JS 错误"
          - "缺少 <meta name=\"viewport\" content=\"width=device-width\">"
          - "CSS 太多"
          - "图片太大"
        answer: 1
        explanation: "viewport meta 标签告诉手机浏览器按设备宽度渲染页面并禁止默认缩放。"
      - id: 161
        difficulty: 3
        question: "JS：querySelector(\".card\")返回 null 最可能原因？"
        options:
          - "CSS 没加载"
          - "JS 在 DOM 之前执行或选择器写错"
          - "浏览器不支持"
          - "HTML 错误"
        answer: 1
        explanation: "JS 在 DOM 元素创建前执行→找不到。解法：script 放 body 底部或用 DOMContentLoaded 事件。"
      - id: 162
        difficulty: 3
        question: "JS：addEventListener(\"click\",handler)→点击没反应可能原因？"
        options:
          - "元素未创建时绑事件"
          - "事件名拼错(如\"clik\")或 handler 未定义"
          - "绑定在了父元素上"
          - "以上都可能"
        answer: 3
        explanation: "三个都可能。检查：元素存在？名字拼对？函数定义了？控制台有报错吗？"
      - id: 163
        difficulty: 3
        question: "JS：innerHTML+=\"<div>新内容</div>\"有什么隐藏问题？"
        options:
          - "没有"
          - "已有元素的绑定事件和状态会被重置"
          - "更快"
          - "不会添加内容"
        answer: 1
        explanation: "innerHTML+=会重新解析整个 HTML→已有元素被重建→之前绑的事件丢失。用 createElement+appendChild 保护已有状态。"
      - id: 164
        difficulty: 3
        question: "JS：[1,2,3,4,5]中筛选>2且×2→结果？"
        options:
          - "[3,4,5]"
          - "[6,8,10]"
          - "报错"
          - "[6,8]"
        answer: 1
        explanation: "[1,2,3,4,5].filter(x=>x>2)得[3,4,5]→.map(x=>x*2)得[6,8,10]。方法链！"
      - id: 165
        difficulty: 3
        question: "HTML+CSS+JS 综合：一个按钮点击应变色但没变→从哪里开始排查？"
        options:
          - "重写代码"
          - "F12 控制台看报错→检查元素是否被选中→检查事件是否绑定→检查 CSS 是否正确"
          - "换浏览器"
          - "重启电脑"
        answer: 1
        explanation: "调试流程：1.控制台报错？2.querySelector 拿到了元素？3.addEventListener 执行了？4.CSS 选择器权重够吗？"
      - id: 166
        difficulty: 3
        question: "HTML+CSS+JS 综合：表单提交不刷新页面用什么？"
        options:
          - "action=\"#\""
          - "e.preventDefault()阻止默认提交"
          - "method=\"POST\""
          - "无法阻止"
        answer: 1
        explanation: "监听 form 的 submit 事件调用 e.preventDefault()阻止浏览器默认刷新行为。然后用 JS/fetch 自己处理数据。"
      - id: 167
        difficulty: 3
        question: "HTML+CSS+JS 综合：从 API 获取数据渲染列表→数据格式不是预期→怎么调试？"
        options:
          - "换 API"
          - "console.log(data)查看实际结构→根据结构调整代码"
          - "放弃"
          - "猜结构"
        answer: 1
        explanation: "先打印数据看实际结构→根据结构写对应代码。API 返回格式经常与预期不同看文档或打印确认。"
      - id: 168
        difficulty: 3
        question: "HTML+CSS+JS 综合：以下关于前端三件套说法哪个正确？"
        options:
          - "JS 可以替代 HTML"
          - "HTML 负责结构 CSS 负责样式 JS 负责交互，三者各司其职"
          - "CSS 可以替代 JS"
          - "HTML 可以替代 CSS"
        answer: 1
        explanation: "HTML=骨架，CSS=皮肤，JS=肌肉。三者各有职责不可互相替代。"
      - id: 169
        difficulty: 3
        question: "HTML+CSS+JS 综合：以下哪项属于\"语义化\"的最佳实践？"
        options:
          - "全部用 div"
          - "header/nav/main/footer 等有含义标签+正确的 heading 层级+alt 属性"
          - "只用 span"
          - "语义化不重要"
        answer: 1
        explanation: "语义化=用有含义的标签和属性让机器(搜索引擎屏幕阅读器)理解页面结构。不只对 SEO 有用对无障碍也重要。"
      - id: 170
        difficulty: 3
        question: "HTML+CSS+JS 综合：以下关于响应式设计的说法哪个正确？"
        options:
          - "只做手机版"
          - "同一套 HTML 通过 CSS @media 适配不同屏幕+弹性单位+灵活布局"
          - "为每种设备各写一套 HTML"
          - "响应式=自适应"
        answer: 1
        explanation: "响应式=同一套 HTML 通过 CSS 媒体查询和弹性单位在不同屏幕呈现合适布局。不是为每种设备写一套 HTML。"
      - id: 171
        difficulty: 3
        question: "HTTP 和 HTTPS 的核心区别？为什么 HTTPS 重要？"
        options:
          - "HTTPS 更快"
          - "HTTPS 在 HTTP 基础上加 TLS/SSL 加密→数据在传输过程中加密不可被窃听或篡改。浏览器标记 HTTP 为\"不安全\""
          - "完全相同"
          - "HTTPS 只用于银行"
        answer: 1
        explanation: "HTTPS=HTTP+TLS加密。三个核心保障：1) 加密（防窃听）；2) 完整性（防篡改）；3) 身份验证（防冒充）。现代浏览器对 HTTP 页面显示\"不安全\"警告，且许多 Web API（如 Geolocation、Service Worker）仅在 HTTPS 下可用。"
      - id: 172
        difficulty: 2
        question: "DNS 是什么？输入网址到看到页面经历了什么？（简述）"
        options:
          - "不需要知道"
          - "DNS 域名解析（域名→IP地址）→TCP 连接→TLS 握手（HTTPS）→发送 HTTP 请求→服务器响应 HTML→浏览器解析渲染。DNS 相当于互联网的电话本"
          - "只涉及 HTTP"
          - "DNS 已过时"
        answer: 1
        explanation: "完整流程：1) DNS 查询（域名→IP）；2) TCP 三次握手建立连接；3) TLS 握手（HTTPS加密）；4) HTTP 请求→服务器处理→响应；5) 浏览器解析 HTML→构建 DOM 树→CSSOM 树→渲染树→布局→绘制。每一步都可能成为性能瓶颈。"
      - id: 173
        difficulty: 2
        question: "浏览器如何渲染一个页面？简述关键渲染路径。"
        options:
          - "直接显示"
          - "HTML→DOM树 + CSS→CSSOM树 + JavaScript执行 → 合并为渲染树(Render Tree) → 布局(Layout/Reflow)计算位置 → 绘制(Paint)填充像素 → 合成(Composite)显示到屏幕"
          - "只需一步"
          - "JS 先执行"
        answer: 1
        explanation: "关键渲染路径（CRP）：1) 解析 HTML 构建 DOM；2) 解析 CSS 构建 CSSOM；3) 两者合并为 Render Tree；4) Layout 计算每个元素的几何位置和大小；5) Paint 将每个像素填充到图层；6) Composite 将图层合并显示。优化 CRP 是性能核心。"
      - id: 174
        difficulty: 3
        question: "什么是回流（Reflow）和重绘（Repaint）？哪个开销更大？"
        options:
          - "完全相同"
          - "回流（Reflow）=元素尺寸/位置/布局改变需要重新计算（开销巨大）。重绘（Repaint）=仅颜色/背景等视觉改变不涉及布局（开销较小）。回流必然触发重绘。"
          - "重绘开销更大"
          - "不需要关心"
        answer: 1
        explanation: "回流：修改 width/height/padding/margin/position/display → 重新计算布局→影响大量元素→最昂贵。重绘：修改 color/background/box-shadow → 只重画像素→较便宜。合成：transform/opacity → 只 GPU 合并图层→最便宜。动画只应修改 transform 和 opacity。"
      - id: 175
        difficulty: 2
        question: "<script> 加 defer 和 async 的区别？"
        options:
          - "完全相同"
          - "都异步下载不阻塞 HTML 解析。defer 等 DOM 解析完再按顺序执行（推荐）。async 下载完立即执行（顺序不确定）适合独立脚本"
          - "defer 阻塞解析"
          - "async 按顺序执行"
        answer: 1
        explanation: "默认 script 同步阻塞→下载+执行都阻塞 HTML 解析。defer：异步下载，HTML 解析完（DOMContentLoaded 前）按文档顺序执行→最常用。async：异步下载，下载完立即执行不保证顺序→适合独立第三方脚本（如统计代码）。type=\"module\" 默认 defer 行为。"
      - id: 176
        difficulty: 3
        question: "CSS 放在 <head> 和 JS 放在 </body> 前的原因？（从渲染角度解释）"
        options:
          - "随意放"
          - "CSS 放 head：尽早加载解析构建 CSSOM，避免\"无样式内容闪烁\"（FOUC）。JS 放 body 底部：等 DOM 构建完成再执行，避免操作尚不存在的 DOM 元素且不阻塞首次渲染"
          - "CSS 放底部"
          - "JS 必须在 head"
        answer: 1
        explanation: "CSS 放 <head>：浏览器尽快获取 CSS 构建 CSSOM，否则渲染树无法构建→白屏或 FOUC（先显示无样式内容再闪变）。JS 放 </body> 前：此时 DOM 已构建完→JS 可安全操作 DOM；且不阻塞首屏渲染→用户更快看到页面。"
      - id: 177
        difficulty: 2
        question: "浏览器的同源策略（Same-Origin Policy）是什么？"
        options:
          - "同网站策略"
          - "协议+域名+端口三者完全相同才算\"同源\"。不同源的页面不能读取对方的 DOM/Cookie/localStorage 等→防止恶意网站窃取信息"
          - "只检查域名"
          - "已废弃"
        answer: 1
        explanation: "同源=协议(https)+域名(example.com)+端口(443)三者都相同。同源策略限制：不同源的 JS 不能读对方页面的数据（DOM/Cookie/Storage），但可发送请求（需服务端 CORS 允许）。这是 Web 安全基石。"
      - id: 178
        difficulty: 3
        question: "浏览器的缓存策略有哪些？强缓存和协商缓存的区别？"
        options:
          - "没有缓存"
          - "强缓存(Cache-Control/Expires)：缓存期内直接使用不发请求(200 from disk cache)。协商缓存(ETag/Last-Modified)：发请求问服务器资源变了没，304 未修改用缓存，200 返回新内容"
          - "只有一种缓存"
          - "缓存不重要"
        answer: 1
        explanation: "强缓存：Cache-Control:max-age=3600（3600秒内直接用本地缓存不发请求）。协商缓存：ETag（文件指纹）+ If-None-Match 或 Last-Modified + If-Modified-Since → 服务器回复 304 Not Modified 用缓存或 200 返回新文件。合理缓存策略是性能优化最重要的一步。"
      - id: 179
        difficulty: 3
        question: "DOMContentLoaded 和 load 事件的区别？"
        options:
          - "完全相同"
          - "DOMContentLoaded=HTML 解析完成 DOM 构建完毕（CSS/图片可能未加载完）。load=所有资源（图片/CSS/JS/字体）全部加载完成"
          - "load 更早"
          - "没区别"
        answer: 1
        explanation: "DOMContentLoaded：HTML 已完全解析，DOM 可操作了（但图片可能还在加载）。适合：初始化 JS 交互。load：页面完全加载包括所有图片/样式/iframe。适合：需要图片尺寸的场景。实际开发中 DOMContentLoaded 更常用。"

  - level: 2
    type: boss
    threshold: 65
    name: 浏览器原理
    questions:
      - id: 180
        difficulty: 2
        question: "浏览器是多进程还是多线程架构？主要有哪些进程？"
        options:
          - "单进程"
          - "多进程架构。主要进程：浏览器进程（UI）、渲染进程（每个标签页一个，沙箱隔离）、GPU 进程、网络进程、插件进程。一个标签页崩溃不影响其他标签页"
          - "单线程"
          - "只有两个进程"
        answer: 1
        explanation: "Chrome 多进程架构：1) 浏览器进程（地址栏/书签/前进后退）；2) 渲染进程（每个标签页独立，负责 HTML/CSS/JS 渲染，沙箱隔离→一个标签崩溃不影响其他）；3) GPU 进程（3D 绘制）；4) 网络进程（资源加载）；5) 插件进程。"
      - id: 181
        difficulty: 2
        question: "JavaScript 是单线程的吗？为什么这样设计？"
        options:
          - "多线程"
          - "JS 主线程是单线程（一个时间只做一件事）。设计原因：避免多线程同时操作 DOM 导致的竞态条件（谁先改？怎么合并？）。通过事件循环（Event Loop）+ 异步任务实现并发"
          - "无法回答"
          - "JS 可以多线程操作 DOM"
        answer: 1
        explanation: "JS 单线程简化编程模型（不用处理多线程同步问题）。但单线程不够用→引入事件循环（Event Loop）：同步代码在主线程执行，异步任务（定时器/网络请求/事件）在任务队列等待，主线程空闲时取出执行。Web Worker 可开子线程但不共享 DOM。"
      - id: 182
        difficulty: 3
        question: "浏览器的 Event Loop（事件循环）机制简述？"
        options:
          - "不需要知道"
          - "主线程执行栈 → 遇到异步任务交给 Web API → 异步完成后回调进入任务队列（宏任务队列/微任务队列）→ 主线程清空执行栈 → 先清空微任务队列（Promise.then）→ 再取一个宏任务（setTimeout/setInterval）→ 循环"
          - "只在 Node.js 有"
          - "已过时"
        answer: 1
        explanation: "执行顺序：同步代码 → 微任务（Promise.then, MutationObserver, queueMicrotask）→ 渲染 → 宏任务（setTimeout, setInterval, I/O, UI事件）。关键：每个宏任务执行完都要清空微任务队列。这就是为什么 Promise.then 比 setTimeout 0 先执行。"
      - id: 183
        difficulty: 3
        question: "如何减少回流（Reflow）？举几种方法。"
        options:
          - "无法避免"
          - "1) 批量修改 DOM（用 DocumentFragment 或 display:none 修改完再显示）；2) 避免逐个读取布局属性（读写分离）；3) 用 transform 代替 left/top；4) 动画用 requestAnimationFrame；5) 用 CSS class 代替逐个 style 修改"
          - "回流无法优化"
          - "用更多 JS"
        answer: 1
        explanation: "减少回流的最佳实践：1) 批量 DOM 操作（DocumentFragment/cloneNode）；2) 读写分离：先一次性读完所有布局属性，再一次性修改，避免强制同步布局（Forced Synchronous Layout）；3) 涉及动画的属性只用 transform/opacity；4) 用 will-change 提前通知浏览器。"
      - id: 184
        difficulty: 2
        question: "浏览器的渲染进程内部有哪些线程？"
        options:
          - "只有一个线程"
          - "主线程（JS执行+样式计算+布局+绘制）、合成线程（GPU 合成图层）、光栅化线程（将绘制指令转为位图）。主线程最繁忙→优化以减少主线程工作量为主"
          - "没有线程"
          - "线程随意"
        answer: 1
        explanation: "渲染进程内部：1) 主线程：运行 JS → 计算样式 → 布局 → 绘制 → 合成帧 → 交给合成器线程；2) 合成器线程：将图层分块交给光栅化线程 → 组装图层帧 → 提交给 GPU；3) 光栅化线程池。长时间 JS 执行会阻塞主线程→页面卡顿。"
      - id: 185
        difficulty: 3
        question: "什么是强制同步布局（Forced Synchronous Layout）？如何避免？"
        options:
          - "特殊布局"
          - "先读布局属性(offsetHeight)→立即修改样式→浏览器必须同步计算布局才能返回正确的读取值→性能杀手。避免：先批量读取所有布局值，再批量写样式（读写分离）"
          - "一种布局算法"
          - "不需要避免"
        answer: 1
        explanation: "强制同步布局=读→写→读的顺序问题。如：el.style.width=\"100px\"; console.log(el.offsetHeight); el.style.height=\"50px\"; console.log(el.offsetWidth)。每次读取都迫使浏览器立即重新布局。解决方案：FastDOM 库或手动\"先批量读完→再批量写\"。"
      - id: 186
        difficulty: 2
        question: "浏览器的图层（Layer）概念？哪些操作会创建新图层？"
        options:
          - "没有图层"
          - "浏览器将页面分解为多个图层→独立绘制→GPU 合成。创建新图层：3D transform、video/canvas、will-change、CSS 动画/过渡的 opacity/transform、iframe。过多图层→内存开销大"
          - "图层有百害无一利"
          - "只 Chrome 支持"
        answer: 1
        explanation: "图层=独立的绘制单元。优势：图层变化只需重新合成无需重绘整个页面。触发新图层：1) 3D transform(translateZ(0))；2) <video>/<canvas>；3) will-change；4) CSS 动画的 transform/opacity。注意：图层不是越多越好→每层消耗 GPU 内存。"
      - id: 187
        difficulty: 3
        question: "浏览器的垃圾回收（GC）机制基本原理？内存泄漏常见原因？"
        options:
          - "自动不需要关心"
          - "标记清除法：从根对象(全局/window)出发标记所有可达对象→清除不可达的。常见内存泄漏：1) 全局变量忘记清理；2) 定时器/事件监听未清除；3) 闭包引用；4) 已移除 DOM 的引用（Detached DOM）"
          - "JS 没有 GC"
          - "内存泄漏不影响"
        answer: 1
